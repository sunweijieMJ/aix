packages:
  - 'apps/*'
  - 'internal/*'
  - 'kit/*'
  - 'packages/*'

# 依赖目录（单一版本真相来源）：子包与根用 `catalog:` 引用，版本只在此处维护。
catalog:
  '@types/markdown-it': ^14.2.0
  '@types/node': ^26.2.0
  '@vitejs/plugin-vue': ^6.0.8
  '@vitest/coverage-v8': ^4.1.11
  '@vue/test-utils': ^2.4.11
  autoprefixer: ^10.5.4
  cross-env: ^10.1.0
  eslint: ^10.9.0
  glob: ^13.0.6
  jsdom: ^29.1.1
  postcss: ^8.5.26
  prettier: ^3.9.6
  rimraf: ^6.1.3
  rollup: ^4.62.5
  rollup-plugin-esbuild: ^6.2.1
  rollup-plugin-postcss: ^4.0.2
  stylelint: ^17.14.1
  tsdown: ^0.22.14
  tsx: ^4.23.12
  typescript: ^6.0.3
  vite: ^8.2.2
  vitest: ^4.1.11
  vue: ^3.5.41
  vue-router: ^5.2.0
  vue-tsc: ^3.3.11

overrides:
  # vitest 把 jsdom 声明为可选 peer（jsdom: '*'）；仅根与 ai-chat 显式依赖 jsdom，
  # 其余包会让该可选 peer 浮动到 registry 最新版，从而生成第二个 vitest 实例
  # （peer 集不同 → 类型不互认，根 vitest.config.ts 会报 TS2769）。此处锁定为目录同一版本。
  jsdom: 'catalog:'
  # @commitlint/config-conventional@21.2 起把 parser preset 提到 ^10，而 10.x 是纯 ESM
  # （exports 只有 types + import，无 require 条件），commitlint 的 resolve-extends 仍用
  # CJS require.resolve 去解析 parserPreset 字符串，直接抛 ERR_PACKAGE_PATH_NOT_EXPORTED
  # 让 commit-msg 钩子整个挂掉。锁回 9.x（有 main 字段、可被 CJS 解析），待上游修复后移除。
  conventional-changelog-conventionalcommits: ^9.3.1
